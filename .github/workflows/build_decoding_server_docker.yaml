name: Build decoding-server image

on:
  workflow_dispatch:
    inputs:
      image_name:
        type: string
        description: GHCR image name, without a tag
        default: ghcr.io/nvidia/private/cudaq-decoders
        required: true
      dev_base_image_version:
        type: string
        description: >-
          Version segment of the ghcr.io/nvidia/cudaqx-dev base image tag:
          "latest" (tracks main) or a release version like "0.7.0" (no
          leading "v") for a reproducible release build
        default: latest
        required: false
      assets_repo:
        type: string
        description: Retrieve decoder assets from a draft release in this repo (e.g. NVIDIA/cudaqx)
        default: 'NVIDIA/cudaqx'
        required: false
      assets_tag:
        type: string
        description: Retrieve decoder assets from a draft release with this tag (e.g. docker-files-123)
        required: false

jobs:
  fetch-assets:
    name: Fetch release assets
    if: ${{ inputs.assets_repo != '' && inputs.assets_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R "${{ inputs.assets_repo }}" "${{ inputs.assets_tag }}"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: decoding-server-release-assets
          path: '*.tar.gz'
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build decoding-server image (${{ matrix.platform }}, CUDA ${{ matrix.cuda_version }})
    needs: fetch-assets
    if: ${{ !cancelled() && github.repository == 'NVIDIA/cudaqx' && (needs.fetch-assets.result == 'success' || needs.fetch-assets.result == 'skipped') }}
    runs-on: linux-${{ matrix.platform }}-cpu8
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        cuda_version: ['12.6', '13.0']
        include:
          - cuda_version: '12.6'
            cuda_runtime_image_tag: 12.6.3-runtime-ubuntu24.04
          - cuda_version: '13.0'
            cuda_runtime_image_tag: 13.0.3-runtime-ubuntu24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release assets
        if: ${{ inputs.assets_repo != '' && inputs.assets_tag != '' }}
        uses: actions/download-artifact@v4
        with:
          name: decoding-server-release-assets
          path: .

      - name: Extract decoder assets
        run: |
          set -euo pipefail

          # Always create the dir (even empty) so build-contexts below has
          # something to point at regardless of whether assets were supplied.
          mkdir -p artifacts

          if [[ -n "${{ inputs.assets_repo }}" ]] && [[ -n "${{ inputs.assets_tag }}" ]]; then
            tar -C artifacts -xzvf nv-qldpc-decoder-${{ matrix.platform }}_ubuntu24.04_cuda${{ matrix.cuda_version }}_release.tar.gz
            test -f artifacts/libcudaq-qec-nv-qldpc-decoder.so
            test -f artifacts/libcudaq-qec-realtime-cudevice-proprietary.a
          else
            echo "No assets_repo/assets_tag supplied; building without decoder artifacts."
          fi
        shell: bash

      - name: Set up context for buildx
        run: docker context create builder_context

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builder_context
          version: v0.19.0
          driver-opts: |
            network=host
            image=moby/buildkit:v0.19.0

      - name: Log in to GitHub CR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image by digest
        id: docker-build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/decoding-server/Dockerfile
          platforms: linux/${{ matrix.platform }}
          build-contexts: |
            artifacts=./artifacts
          build-args: |
            CUDA_VERSION=${{ matrix.cuda_version }}
            cuda_runtime_image_tag=${{ matrix.cuda_runtime_image_tag }}
            dev_base_image_version=${{ inputs.dev_base_image_version }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ inputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.docker-build.outputs.digest }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/digests
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: decoding-server-digest-cu${{ matrix.cuda_version }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish decoding-server multi-platform image (CUDA ${{ matrix.cuda_version }})
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        cuda_version: ['12.6', '13.0']
    steps:
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub CR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: decoding-server-digest-cu${{ matrix.cuda_version }}-*
          merge-multiple: true

      - name: Create and verify multi-platform image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          CUDA_VERSION: ${{ matrix.cuda_version }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Tag with the short commit SHA (traceable to an exact commit)
          # and with the release version when built from a
          # releases/vX.Y.Z branch. All tags point at the same
          # multi-platform manifest.
          short_sha="${GITHUB_SHA:0:8}"
          tags=("${IMAGE_NAME}:${short_sha}-cu${CUDA_VERSION}")

          if [[ "$GIT_REF_NAME" == releases/* ]]; then
            release_version=$(echo "$GIT_REF_NAME" | grep -Eo '([0-9]+\.)+[0-9]+')
            tags+=("${IMAGE_NAME}:${release_version}-cu${CUDA_VERSION}")
          fi

          cd /tmp/digests
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" != 2 ]]; then
            echo "::error::Expected 2 image digests, found ${#digests[@]}"
            exit 1
          fi

          refs=()
          for digest in "${digests[@]}"; do
            refs+=("${IMAGE_NAME}@sha256:${digest}")
          done

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

          # All tags above point at the same manifest; verify/inspect via
          # the first (always-present) one.
          image_ref="${tags[0]}"
          manifest=$(docker buildx imagetools inspect --raw "$image_ref")
          for architecture in amd64 arm64; do
            jq -e \
              --arg architecture "$architecture" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture)' \
              <<< "$manifest" > /dev/null
          done

          echo "Tagged as:"
          printf '  %s\n' "${tags[@]}"
          docker buildx imagetools inspect "$image_ref"
